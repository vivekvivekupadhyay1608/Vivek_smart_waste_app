name: vivek_smart_waste_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '^3.13.2'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  image_picker: ^1.0.7
  firebase_storage: ^12.1.0
  url_launcher: ^6.3.3
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/Ecotrack.png

flutter_launcher_icons:
  image_path: "assets/Ecotrack.png"
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/Ecotrack.png"